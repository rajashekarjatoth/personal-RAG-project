[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnirag-studio"
version = "0.1.0"
description = "OmniRAG Studio: Dynamic Multi-Domain Advanced RAG Engine & Observability Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "anthropic>=0.20.0",
    "openai>=1.10.0",
    "sentence-transformers>=2.3.0",
    "torch>=2.0.0"
]
